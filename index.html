<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
    }

    .login-box {
      width: 350px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .input-box {
      margin-bottom: 20px;
    }

    .input-box input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
      transition: 0.3s;
    }

    .input-box input:focus {
      border-color: #2a5298;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2a5298;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: #1e3c72;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>LOGIN</h2>

    <div class="input-box">
      <input type="text" id="username" placeholder="Username">
    </div>

    <div class="input-box">
      <input type="password" id="password" placeholder="Password">
    </div>

    <button class="login-btn" onclick="login()">เข้าสู่ระบบ</button>

    <div class="message" id="message"></div>
  </div>

  <script>
    function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const message = document.getElementById('message');

      if(username === 'kcp' && password === '076491274') {
        message.style.color = 'green';
        message.innerHTML = 'เข้าสู่ระบบสำเร็จ 🎉';
  
        setTimeout(() => {
          window.location.href = 'home.html';
        }, 1000);
      } else {
        message.style.color = 'red';
        message.innerHTML = 'Username หรือ Password ไม่ถูกต้อง';
      }
    }
  </script>

</body>
</html>
